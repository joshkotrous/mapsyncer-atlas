

apply from: rootProject.file('gradle/lz4-relocate.gradle')

configurations {
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

tasks.named('jar', Jar) {
    archiveClassifier.set('dev')
}

tasks.named('shadowJar') {
    archiveClassifier.set('dev-all')
    configurations = [project.configurations.shadowBundle]
    configureLz4ShadowExcludes(it)
}

afterEvaluate {
    def remapJarTask = tasks.findByName('remapJar')
    if (remapJarTask != null) {

        remapJarTask.dependsOn(tasks.named('shadowJar'))
        remapJarTask.inputFile.set(tasks.named('shadowJar').flatMap { it.archiveFile })
    } else {

        tasks.named('jar', Jar) {
            enabled = false
        }
        tasks.named('shadowJar') {
            archiveClassifier.set('')
        }
        tasks.named('assemble').configure {
            dependsOn(tasks.named('shadowJar'))
        }
    }
}

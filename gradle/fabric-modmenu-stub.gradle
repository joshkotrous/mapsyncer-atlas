

sourceSets {
    modMenuApi {
        java {
            srcDirs = ["${rootProject.projectDir}/gradle/modmenu-api-stub"]
        }
        compileClasspath += sourceSets.main.compileClasspath
    }
}

tasks.named('compileModMenuApiJava', JavaCompile).configure {

    classpath = sourceSets.main.compileClasspath
}

tasks.named('compileJava', JavaCompile).configure {
    dependsOn tasks.named('compileModMenuApiJava')
    classpath += sourceSets.modMenuApi.output
}

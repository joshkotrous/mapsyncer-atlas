plugins {
    id 'net.neoforged.moddev' version '2.0.141'
    id 'com.gradleup.shadow' version '8.3.5'
}

version = mod_version + '-neoforge-' + g2_jar_suffix
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
}

neoForge {
    // NeoForge 21.1.x for Minecraft 1.21.1
    version = "21.1.77"

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'mixin.env.remapRefMap', 'true'
            systemProperty 'mixin.env.refMapRemapping', 'true'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

sourceSets.main.java.srcDir "${rootProject.projectDir}/libs/mc-1.21/src/main/java"
sourceSets.main.resources.srcDir "${rootProject.projectDir}/libs/mc-1.21/src/main/resources"

sourceSets.main.java.srcDir "${rootProject.projectDir}/libs/common/src/main/java"
sourceSets.main.resources.srcDir "${rootProject.projectDir}/libs/common/src/main/resources"

dependencies {

    implementation project(':libs:core')
    implementation project(':libs:platform-api')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_range_forge", g2_minecraft_range_forge

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version,
                "minecraft_range_forge": g2_minecraft_range_forge
    }
}

apply from: rootProject.file('gradle/lz4-relocate.gradle')

configurations {
    bundle
}
dependencies {
    bundle project(':libs:core')
    bundle project(':libs:platform-api')
}

shadowJar {
    archiveClassifier.set('')
    configurations = [project.configurations.bundle]
    configureLz4ShadowExcludes(it)
}

tasks.named('jar') {
    archiveClassifier.set('slim')
    dependsOn shadowJar
}

tasks.named('jarJar') {
    enabled = false
}

publishing {
    publications {
        if (!publications.findByName('mavenJava')) {
            register('mavenJava', MavenPublication) {
                from components.java
            }
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

plugins {
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'com.gradleup.shadow' version '8.3.5'
}

version = mod_version + '-forge-' + g2_jar_suffix
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.aliyun.com/repository/public' }
}

minecraft {

    mappings channel: 'official', version: '1.21.1'

    reobf = false

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

sourceSets.main.java.srcDir "${rootProject.projectDir}/libs/mc-1.21/src/main/java"
sourceSets.main.resources.srcDir "${rootProject.projectDir}/libs/mc-1.21/src/main/resources"
sourceSets.main.java.srcDir "${rootProject.projectDir}/libs/common/src/main/java"
sourceSets.main.resources.srcDir "${rootProject.projectDir}/libs/common/src/main/resources"

dependencies {
    // Minecraft Forge 1.21.1 (Forge 52.x)
    minecraft "net.minecraftforge:forge:1.21.1-52.0.0"

    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }

    implementation project(':libs:core')
    implementation project(':libs:platform-api')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_range_forge", g2_minecraft_range_forge

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version,
                "minecraft_range_forge": g2_minecraft_range_forge
    }
}

apply from: rootProject.file('gradle/lz4-relocate.gradle')

configurations {
    bundle
}
dependencies {
    bundle project(':libs:core')
    bundle project(':libs:platform-api')
}

shadowJar {
    archiveClassifier.set('')
    configurations = [project.configurations.bundle]
    configureLz4ShadowExcludes(it)
}

tasks.named('jar') {
    archiveClassifier.set('slim')
    dependsOn shadowJar
}

tasks.named('jarJar') {
    enabled = false
}

publishing {
    publications {
        register('forge121MavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

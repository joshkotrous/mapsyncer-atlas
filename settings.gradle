pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()

        maven { url = 'https://maven.neoforged.net/releases' }

        maven { url = 'https://maven.minecraftforge.net/' }

        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = mod_id

include 'libs:core'
include 'libs:lz4-relocated'
include 'libs:platform-api'
include 'libs:common'
include 'libs:mc-1.20'
include 'libs:mc-1.21'
include 'libs:mc-1.21.11'
include 'libs:mc-26'

// MC 1.20.1
include 'mc-1.20.1:fabric'

// include 'mc-1.20.4:shared'
// include 'mc-1.20.4:neoforge'
// include 'mc-1.20.4:forge'
// include 'mc-1.20.4:fabric'

// MC 1.21.1
include 'mc-1.21.1:fabric'

include 'mc-1.21.1:neoforge'

// MC 1.21.11

include 'mc-1.21.11:neoforge'

// MC 26.1
include 'mc-26.1:neoforge'

include 'mc-26.2:neoforge'

include 'mc-26.3:neoforge'

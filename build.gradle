plugins {
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

subprojects {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.shedaniel.me/' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

afterEvaluate {
    task buildAll {
        dependsOn ':libs:core:build'
        dependsOn ':libs:platform-api:build'
        dependsOn ':mc-1.20.1:fabric:build'
        dependsOn ':mc-1.21.1:fabric:build'
        dependsOn ':mc-1.21.1:neoforge:build'
        dependsOn ':mc-1.21.11:neoforge:build'
        dependsOn ':mc-26.1:neoforge:build'
        dependsOn ':mc-26.2:neoforge:build'
        dependsOn ':mc-26.3:neoforge:build'
        finalizedBy 'collectJars'
    }
}

tasks.register('collectJars', Copy) {
    description = 'Collect all subproject JARs into the output directory'
    group = 'distribution'
    into layout.projectDirectory.dir('output')

    subprojects { sub ->
        from(sub.layout.buildDirectory.dir('libs')) {
            include '*.jar'
            exclude '*-slim.jar', '*-sources.jar', '*-javadoc.jar'
        }
    }

    outputs.upToDateWhen { false }
}

tasks.register('buildPackager') {
    description = 'Build the MapPackager tool and copy it to the output directory'
    group = 'distribution'
    dependsOn ':libs:core:mapPackagerDist'
    doLast {
        copy {
            from(rootProject.layout.projectDirectory.dir('libs/core/build/dist')) {
                include 'mapsyncer-packager-*.zip'
            }
            into layout.projectDirectory.dir('output')
        }
        logger.lifecycle('MapPackager artifacts were copied to output/')
    }
}

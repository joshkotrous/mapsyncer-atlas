

//

pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'mapsyncer'

include 'libs:core'
include 'libs:lz4-relocated'
include 'libs:platform-api'
include 'libs:common'
include 'libs:mc-1.20'
include 'libs:mc-1.21'
include 'libs:mc-1.21.11'

include 'mc-1.20.1:forge'

include 'mc-1.21.1:forge'

include 'mc-1.21.11:forge'



//

pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = mod_id

include 'libs:core'
include 'libs:lz4-relocated'
include 'libs:platform-api'
include 'libs:common'
include 'libs:mc-26'

include 'mc-26.1:neoforge'
include 'mc-26.1:fabric'
include 'mc-26.2:neoforge'
include 'mc-26.2:fabric'
include 'mc-26.3:neoforge'
include 'mc-26.3:fabric'
